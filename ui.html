<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --panel: #f5f5f5;
        --border: #e5e5e5;
        --text: #1a1a1a;
        --muted: #6b6b6b;
        --blue: #0d99ff;
        --blue-hover: #0b86e0;
        --red: #f24822;
        --chip: #f0f0f0;
        --chip-active: #e8f4ff;
        --chip-active-text: #0d99ff;
        --well: #f7f7f7;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.4 Inter, system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .top {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 12px 12px 8px;
        border-bottom: 1px solid var(--border);
        position: relative;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .chip {
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        cursor: pointer;
        line-height: 1.2;
      }
      .chip.active {
        background: var(--chip-active);
        border-color: #b8deff;
        color: var(--chip-active-text);
        font-weight: 600;
      }
      .settings-wrap { position: relative; flex-shrink: 0; }
      .settings-btn {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .settings-btn:hover { background: var(--panel); }
      .settings-btn svg { display: block; }
      .tabs.hidden { display: none; }
      .settings-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .settings-back {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        line-height: 1;
        color: var(--text);
      }
      .settings-back:hover { background: var(--panel); }
      .settings-title {
        font-size: 13px;
        font-weight: 600;
      }
      .settings-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      .settings-section {
        margin-bottom: 18px;
      }
      .settings-section h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .settings-section label.check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        cursor: pointer;
        font-size: 12px;
      }
      .settings-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
        font-size: 12px;
      }
      .settings-field > span {
        color: var(--muted);
        font-size: 11px;
      }
      .color-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-size: 12px;
      }
      .color-row .color-label {
        width: 56px;
        flex-shrink: 0;
      }
      .color-row input[type="color"] {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .swatches {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 1px solid rgba(0,0,0,0.15);
        cursor: pointer;
        padding: 0;
      }
      .swatch:hover { outline: 2px solid var(--blue); outline-offset: 1px; }
      .settings-range {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .settings-range input[type="range"] {
        flex: 1;
      }
      .settings-range .range-val {
        min-width: 28px;
        text-align: right;
        font-size: 11px;
        font-weight: 600;
      }
      .settings-note {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .error-swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: #E53833;
        vertical-align: -1px;
        margin-right: 4px;
      }
      .banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 12px;
        padding: 10px 12px;
        background: var(--panel);
        border-radius: 8px;
      }
      .banner-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .banner-title {
        font-weight: 600;
        font-size: 12px;
      }
      .count-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: #e8e8e8;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .btn {
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) { background: var(--blue-hover); }
      .btn-sm {
        padding: 5px 10px;
        font-size: 11px;
      }
      .list {
        flex: 1;
        overflow: auto;
        padding: 0 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .section-label:first-child { margin-top: 0; }
      .section-count {
        font-weight: 600;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        padding: 10px;
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .cat-icon {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: var(--panel);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        color: var(--muted);
      }
      .card-meta { flex: 1; min-width: 0; }
      .card-title {
        font-weight: 600;
        font-size: 12px;
        margin: 0 0 2px;
      }
      .card-sub {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kebab-wrap { position: relative; flex-shrink: 0; }
      .kebab {
        width: 24px;
        height: 24px;
        border: 0;
        background: transparent;
        border-radius: 4px;
        cursor: pointer;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        padding: 0;
      }
      .kebab:hover { background: var(--panel); color: var(--text); }
      .menu {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        min-width: 120px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: var(--shadow);
        z-index: 15;
        padding: 4px;
      }
      .menu.open { display: block; }
      .menu button {
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 7px 8px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        color: var(--text);
      }
      .menu button:hover { background: var(--panel); }
      .well {
        margin-top: 8px;
        background: var(--well);
        border-radius: 6px;
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .well.select-well {
        flex-direction: column;
        align-items: stretch;
      }
      .well select {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 5px 6px;
        font-size: 11px;
        background: #fff;
        color: var(--text);
      }
      .cand-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cand {
        width: 100%;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        color: var(--text);
        text-align: left;
        box-sizing: border-box;
      }
      .cand:hover { border-color: var(--blue); }
      .cand.selected {
        border-color: var(--blue);
        background: var(--chip-active);
        box-shadow: 0 0 0 1px var(--blue);
      }
      .cand-thumb {
        width: 100%;
        height: 96px;
        border-radius: 4px;
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .cand-thumb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }
      .cand-thumb-fallback {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        padding: 8px;
        word-break: break-word;
        line-height: 1.2;
      }
      .cand-foot {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        min-width: 0;
      }
      .cand-cap {
        flex: 1;
        min-width: 0;
        font-size: 10px;
        line-height: 1.25;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cand.selected .cand-cap { color: var(--chip-active-text); }
      .cand-focus {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .cand-focus:hover {
        color: var(--blue);
        background: rgba(24, 160, 251, 0.12);
      }
      .cand.selected .cand-focus { color: var(--chip-active-text); }
      .well-token {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .well-empty {
        flex: 1;
        font-size: 11px;
        color: var(--muted);
      }
      .nearest {
        display: inline-block;
        margin-left: 4px;
        font-size: 10px;
        color: #b36b00;
        font-weight: 600;
      }
      .empty {
        padding: 24px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        background: #fff;
      }
      .footer-label {
        font-weight: 600;
        font-size: 12px;
      }
      .total-badge {
        min-width: 22px;
        height: 20px;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--red);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .ignored-panel {
        border-top: 1px solid var(--border);
        padding: 10px 12px;
        background: #fff;
        max-height: 140px;
        overflow: auto;
      }
      .ignored-panel.hidden { display: none; }
      .ignored-title {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .ignored-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
      }
      .ignored-name {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ignored-remove {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .ignored-remove:hover {
        background: var(--panel);
        color: var(--text);
      }
      .status {
        padding: 0 12px 8px;
        color: var(--muted);
        font-size: 11px;
      }
      .status-scanning {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .skel-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        padding: 10px;
      }
      .skel-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .skel-icon {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: var(--panel);
        flex-shrink: 0;
        animation: skel-pulse 1.2s ease-in-out infinite;
      }
      .skel-meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 2px;
      }
      .skel-line {
        height: 10px;
        border-radius: 4px;
        background: var(--panel);
        animation: skel-pulse 1.2s ease-in-out infinite;
      }
      .skel-line.short { width: 42%; }
      .skel-line.med { width: 68%; }
      .skel-line.long { width: 88%; }
      @keyframes skel-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .tabs {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding: 0 8px 0 12px;
        flex-shrink: 0;
        background: #fff;
      }
      .tabs-left {
        display: flex;
        gap: 0;
        min-width: 0;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
        cursor: grab;
      }
      .tabs-left::-webkit-scrollbar {
        display: none;
      }
      .tabs-left.dragging {
        cursor: grabbing;
        user-select: none;
      }
      .tab {
        border: 0;
        background: transparent;
        padding: 10px 8px 9px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .tab.active {
        color: var(--text);
        border-bottom-color: var(--blue);
      }
      .tabs .settings-wrap {
        margin-bottom: 2px;
      }
      .panel {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }
      .panel.active { display: flex; }
      .coverage {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 12px 8px;
        padding: 8px 10px;
        background: var(--panel);
        border-radius: 8px;
      }
      .coverage-bar {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: #e5e5e5;
        overflow: hidden;
      }
      .coverage-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--blue);
        width: 0%;
        transition: width 0.2s ease;
      }
      .coverage-fill.pristine { background: #2ea35f; }
      .coverage-label {
        font-size: 11px;
        font-weight: 700;
        min-width: 36px;
        text-align: right;
      }
      .value-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 12px 8px;
      }
      .value-chips.hidden { display: none; }
      .value-chip {
        border: 1px solid var(--border);
        background: var(--chip);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      .value-chip.active {
        background: var(--chip-active);
        border-color: #b8deff;
        color: var(--chip-active-text);
        font-weight: 600;
      }
      .ambiguous {
        display: inline-block;
        margin-left: 4px;
        font-size: 10px;
        color: #b36b00;
        font-weight: 600;
      }
      .settings-select {
        width: 100%;
        margin-top: 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="tabs" id="tabs">
      <div class="tabs-left">
        <button type="button" class="tab active" data-tab="errors" data-label="Error list">Error list</button>
        <button type="button" class="tab" data-tab="design" data-label="Design">Design</button>
        <button type="button" class="tab" data-tab="layout" data-label="Layout">Layout</button>
        <button type="button" class="tab" data-tab="components" data-label="Components">Components</button>
      </div>
      <div class="settings-wrap">
        <button class="settings-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2.5" y="1.5" width="2.5" height="11" rx="1.25" stroke="#1a1a1a" stroke-width="1.2"/>
            <rect x="9" y="1.5" width="2.5" height="11" rx="1.25" stroke="#1a1a1a" stroke-width="1.2"/>
            <rect x="1.75" y="4" width="4" height="2.25" rx="1.1" fill="#1a1a1a"/>
            <rect x="8.25" y="7.5" width="4" height="2.25" rx="1.1" fill="#1a1a1a"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="panel active" id="panel-errors">
      <div class="top">
        <div class="chips" id="errorChips"></div>
      </div>
      <div class="coverage" id="coverageRow" title="Share of checked properties using tokens/styles">
        <span class="banner-title">Coverage</span>
        <div class="coverage-bar"><div class="coverage-fill" id="coverageFill"></div></div>
        <span class="coverage-label" id="coverageLabel">100%</span>
      </div>
      <div class="value-chips hidden" id="valueChips"></div>
      <div class="banner">
        <div class="banner-left">
          <span class="banner-title">Automatic Fixes</span>
          <span class="count-pill" id="fixableCount">0</span>
        </div>
        <button class="btn btn-primary" id="fixAll" type="button" disabled>Fix All</button>
      </div>
      <div class="status" id="status">Select a frame</div>
      <div class="list" id="list"></div>
      <div class="ignored-panel hidden" id="ignoredPanel">
        <h3 class="ignored-title">Ignore layers</h3>
        <div id="ignoredList"></div>
      </div>
      <div class="footer">
        <span class="footer-label">Total Errors</span>
        <span class="total-badge" id="totalCount">0</span>
      </div>
    </div>

    <div class="panel" id="panel-design">
      <div class="top">
        <div class="chips" id="designChips"></div>
      </div>
      <div class="banner">
        <div class="banner-left">
          <span class="banner-title">Design issues</span>
          <span class="count-pill" id="designCount">0</span>
        </div>
        <button class="btn btn-primary" id="designFixAll" type="button" disabled>Fix All</button>
      </div>
      <div class="status" id="designStatus">Select a frame</div>
      <div class="list" id="designList"></div>
    </div>

    <div class="panel" id="panel-layout">
      <div class="top">
        <div class="chips" id="layoutChips"></div>
      </div>
      <div class="banner">
        <div class="banner-left">
          <span class="banner-title">Layout issues</span>
          <span class="count-pill" id="layoutCount">0</span>
        </div>
        <button class="btn btn-primary" id="layoutFixAll" type="button" disabled>Fix All</button>
      </div>
      <div class="status" id="layoutStatus">Select a frame</div>
      <div class="list" id="layoutList"></div>
    </div>

    <div class="panel" id="panel-components">
      <div class="banner">
        <div class="banner-left">
          <span class="banner-title">Component matches</span>
          <span class="count-pill" id="matchCount">0</span>
        </div>
        <button class="btn btn-primary" id="useAll" type="button" disabled>Use all</button>
      </div>
      <div class="status" id="componentStatus">Select a frame to scan</div>
      <div class="list" id="componentList"></div>
    </div>

    <div class="panel" id="panel-settings">
      <div class="settings-header">
        <button class="settings-back" id="settingsBack" type="button" title="Back" aria-label="Back">←</button>
        <span class="settings-title">Settings</span>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <h3>Show overlays</h3>
          <label class="check"><input type="checkbox" id="optRadius" checked /> Border radius</label>
          <label class="check"><input type="checkbox" id="optPadding" checked /> Padding</label>
          <label class="check"><input type="checkbox" id="optGap" checked /> Gap</label>
          <label class="check"><input type="checkbox" id="optDistance" checked /> Distance</label>
          <label class="check"><input type="checkbox" id="optLayout" checked /> Layout</label>
          <label class="check"><input type="checkbox" id="optComponents" checked /> Components</label>
        </div>

        <div class="settings-section">
          <h3>Overlay colors</h3>
          <div class="color-row" data-color-key="radius">
            <span class="color-label">Radius</span>
            <input type="color" id="optColorRadius" value="#3373F2" />
            <div class="swatches" data-for="optColorRadius"></div>
          </div>
          <div class="color-row" data-color-key="padding">
            <span class="color-label">Padding</span>
            <input type="color" id="optColorPadding" value="#2EA35F" />
            <div class="swatches" data-for="optColorPadding"></div>
          </div>
          <div class="color-row" data-color-key="gap">
            <span class="color-label">Gap</span>
            <input type="color" id="optColorGap" value="#F5C72E" />
            <div class="swatches" data-for="optColorGap"></div>
          </div>
          <p class="settings-note"><span class="error-swatch"></span>Errors stay red (#E53833)</p>
          <label class="settings-field">Overlay opacity
            <div class="settings-range">
              <input type="range" id="optOverlayOpacity" min="5" max="100" step="1" value="22" />
              <span class="range-val" id="optOverlayOpacityVal">22%</span>
            </div>
          </label>
        </div>

        <div class="settings-section">
          <h3>Label pill</h3>
          <label class="settings-field">Size
            <div class="settings-range">
              <input type="range" id="optLabelScale" min="0.5" max="2" step="0.05" value="1" />
              <span class="range-val" id="optLabelScaleVal">1</span>
            </div>
          </label>
          <label class="settings-field">Opacity
            <div class="settings-range">
              <input type="range" id="optPillOpacity" min="5" max="100" step="1" value="100" />
              <span class="range-val" id="optPillOpacityVal">100%</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <script>
      const DESIGN_FILTERS = [
        { id: "all", label: "All" },
        { id: "text", label: "Text" },
        { id: "color", label: "Color" },
        { id: "stroke", label: "Stroke" },
        { id: "effect", label: "Effect" },
        { id: "opacity", label: "Opacity" },
      ];

      const LAYOUT_FILTERS = [
        { id: "all", label: "All" },
        { id: "spacing", label: "Spacing" },
        { id: "gap", label: "Gap" },
        { id: "radius", label: "Radius" },
        { id: "sizing", label: "Sizing" },
        { id: "detached", label: "Detached" },
      ];

      const ERROR_FILTERS = [
        { id: "all", label: "All" },
        { id: "text", label: "Text" },
        { id: "color", label: "Color" },
        { id: "stroke", label: "Stroke" },
        { id: "effect", label: "Effect" },
        { id: "opacity", label: "Opacity" },
        { id: "spacing", label: "Spacing" },
        { id: "gap", label: "Gap" },
        { id: "radius", label: "Radius" },
        { id: "sizing", label: "Sizing" },
        { id: "detached", label: "Detached" },
        { id: "components", label: "Components" },
      ];

      const DESIGN_CATS = ["text", "color", "stroke", "effect", "opacity"];
      const LAYOUT_TOKEN_CATS = ["spacing", "radius"];

      const CAT_ICON = {
        text: "T",
        spacing: "↔",
        gap: "↔",
        radius: "⌒",
        color: "●",
        stroke: "▭",
        effect: "✦",
        opacity: "◐",
        layout: "▦",
        detached: "◇",
      };

      let issues = [];
      let layoutIssues = [];
      let ignoredLayers = [];
      let componentMatches = [];
      let designFilter = "all";
      let layoutFilter = "all";
      let errorFilter = "all";
      let activeTab = "errors";
      let settingsOpen = false;
      let openMenuId = null;
      let scanning = false;
      let coveragePct = 100;
      let spacingValues = [];
      let focusSpacingValue = null;

      const COLOR_SWATCHES = ["#3373F2", "#2EA35F", "#F5C72E", "#AB73E6", "#555555"];

      const listEl = document.getElementById("list");
      const statusEl = document.getElementById("status");
      const fixableCountEl = document.getElementById("fixableCount");
      const totalCountEl = document.getElementById("totalCount");
      const fixAllBtn = document.getElementById("fixAll");
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsBack = document.getElementById("settingsBack");
      const panelSettings = document.getElementById("panel-settings");
      const ignoredPanel = document.getElementById("ignoredPanel");
      const ignoredListEl = document.getElementById("ignoredList");
      const coverageFill = document.getElementById("coverageFill");
      const coverageLabel = document.getElementById("coverageLabel");
      const valueChipsEl = document.getElementById("valueChips");
      const optRadius = document.getElementById("optRadius");
      const optPadding = document.getElementById("optPadding");
      const optGap = document.getElementById("optGap");
      const optDistance = document.getElementById("optDistance");
      const optLayout = document.getElementById("optLayout");
      const optComponents = document.getElementById("optComponents");
      const optColorRadius = document.getElementById("optColorRadius");
      const optColorPadding = document.getElementById("optColorPadding");
      const optColorGap = document.getElementById("optColorGap");
      const optLabelScale = document.getElementById("optLabelScale");
      const optLabelScaleVal = document.getElementById("optLabelScaleVal");
      const optOverlayOpacity = document.getElementById("optOverlayOpacity");
      const optOverlayOpacityVal = document.getElementById("optOverlayOpacityVal");
      const optPillOpacity = document.getElementById("optPillOpacity");
      const optPillOpacityVal = document.getElementById("optPillOpacityVal");
      const tabsEl = document.getElementById("tabs");
      const panelErrors = document.getElementById("panel-errors");
      const panelDesign = document.getElementById("panel-design");
      const panelLayout = document.getElementById("panel-layout");
      const panelComponents = document.getElementById("panel-components");
      const errorChipsEl = document.getElementById("errorChips");
      const designChipsEl = document.getElementById("designChips");
      const layoutChipsEl = document.getElementById("layoutChips");
      const designListEl = document.getElementById("designList");
      const designStatusEl = document.getElementById("designStatus");
      const designCountEl = document.getElementById("designCount");
      const designFixAllBtn = document.getElementById("designFixAll");
      const layoutListEl = document.getElementById("layoutList");
      const layoutStatusEl = document.getElementById("layoutStatus");
      const layoutCountEl = document.getElementById("layoutCount");
      const layoutFixAllBtn = document.getElementById("layoutFixAll");
      const componentListEl = document.getElementById("componentList");
      const componentStatusEl = document.getElementById("componentStatus");
      const matchCountEl = document.getElementById("matchCount");
      const useAllBtn = document.getElementById("useAll");

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function designIssues() {
        return issues.filter((i) => DESIGN_CATS.indexOf(i.category) !== -1);
      }

      function layoutTokenIssues() {
        return issues.filter((i) => LAYOUT_TOKEN_CATS.indexOf(i.category) !== -1);
      }

      function isGapIssue(issue) {
        return (
          issue.category === "spacing" &&
          String(issue.field || "").toLowerCase().indexOf("gap") !== -1
        );
      }

      function matchesChipFilter(issue, filterId) {
        if (!filterId || filterId === "all") return true;
        if (filterId === "gap") return isGapIssue(issue);
        if (filterId === "spacing") {
          return issue.category === "spacing" && !isGapIssue(issue);
        }
        return issue.category === filterId;
      }

      function filteredDesignIssues() {
        const list = designIssues();
        if (designFilter === "all") return list;
        return list.filter((i) => matchesChipFilter(i, designFilter));
      }

      function filteredLayoutTokenIssues() {
        return layoutTokenIssues().filter((i) => matchesChipFilter(i, layoutFilter));
      }

      function filteredLayoutAutoIssues(filterId) {
        const filter = filterId || layoutFilter;
        if (!filter || filter === "all") return layoutIssues;
        if (filter === "sizing") {
          return layoutIssues.filter((i) => i.kind === "layout-fixed-size");
        }
        if (filter === "detached") {
          return layoutIssues.filter((i) => i.kind === "detached-instance");
        }
        return [];
      }

      function canFixIssue(issue) {
        if (!issue) return false;
        if (issue.fixable) return true;
        if (issue.ambiguous && issue.tokenCandidates && issue.tokenCandidates.length) return true;
        if (issue.matchQuality === "nearest" && issue.variableId) return true;
        return false;
      }

      function renderCoverage() {
        const pct = typeof coveragePct === "number" ? coveragePct : 100;
        coverageFill.style.width = pct + "%";
        coverageFill.classList.toggle("pristine", pct >= 100);
        coverageLabel.textContent = pct + "%";
      }

      function renderValueChips() {
        if (!spacingValues.length) {
          valueChipsEl.classList.add("hidden");
          valueChipsEl.innerHTML = "";
          return;
        }
        valueChipsEl.classList.remove("hidden");
        valueChipsEl.innerHTML =
          '<button type="button" class="value-chip' +
          (focusSpacingValue == null ? " active" : "") +
          '" data-spacing-value="">All</button>' +
          spacingValues
            .map(
              (v) =>
                '<button type="button" class="value-chip' +
                (focusSpacingValue === v ? " active" : "") +
                '" data-spacing-value="' +
                v +
                '">' +
                v +
                "</button>"
            )
            .join("");
      }

      function chipCountIn(list, filterId) {
        if (filterId === "all") return list.length;
        return list.filter((i) => matchesChipFilter(i, filterId)).length;
      }

      function renderChipRow(el, filters, activeId, countFn) {
        el.innerHTML = filters
          .map((f) => {
            const count = countFn(f.id);
            const label = count > 0 ? f.label + " (" + count + ")" : f.label;
            return (
              '<button type="button" class="chip' +
              (f.id === activeId ? " active" : "") +
              '" data-filter="' +
              f.id +
              '">' +
              label +
              "</button>"
            );
          })
          .join("");
      }

      function findIssue(id) {
        return (
          issues.find((i) => i.id === id) ||
          layoutIssues.find((i) => i.id === id) ||
          null
        );
      }

      function formatScale(n) {
        return String(Number(n).toFixed(2).replace(/\.?0+$/, "") || "1");
      }

      function syncRangeLabels() {
        optLabelScaleVal.textContent = formatScale(optLabelScale.value);
        optOverlayOpacityVal.textContent = String(optOverlayOpacity.value) + "%";
        optPillOpacityVal.textContent = String(optPillOpacity.value) + "%";
      }

      function postOptions() {
        const scale = Number(optLabelScale.value);
        parent.postMessage(
          {
            pluginMessage: {
              type: "options",
              radius: optRadius.checked,
              padding: optPadding.checked,
              gap: optGap.checked,
              distance: optDistance.checked,
              layout: optLayout.checked,
              components: optComponents.checked,
              colors: {
                radius: optColorRadius.value,
                padding: optColorPadding.value,
                gap: optColorGap.value,
              },
              labelFontSize: Math.min(16, Math.max(6, Math.round(8 * scale))),
              pillSize: scale,
              overlayOpacity: Number(optOverlayOpacity.value) / 100,
              pillOpacity: Number(optPillOpacity.value) / 100,
            },
          },
          "*"
        );
      }

      function openSettings() {
        settingsOpen = true;
        tabsEl.classList.add("hidden");
        panelErrors.classList.remove("active");
        panelDesign.classList.remove("active");
        panelLayout.classList.remove("active");
        panelComponents.classList.remove("active");
        panelSettings.classList.add("active");
      }

      function closeSettings() {
        settingsOpen = false;
        panelSettings.classList.remove("active");
        tabsEl.classList.remove("hidden");
        setTab(activeTab);
      }

      function fillSwatches() {
        document.querySelectorAll(".swatches").forEach((wrap) => {
          const inputId = wrap.getAttribute("data-for");
          const input = document.getElementById(inputId);
          wrap.innerHTML = "";
          COLOR_SWATCHES.forEach((hex) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "swatch";
            btn.title = hex;
            btn.style.background = hex;
            btn.addEventListener("click", () => {
              if (!input) return;
              input.value = hex;
              postOptions();
            });
            wrap.appendChild(btn);
          });
        });
      }

      fillSwatches();
      syncRangeLabels();

      function collectSelections(scopeIssues) {
        const selections = [];
        for (const issue of scopeIssues) {
          const sel = document.querySelector('select[data-issue-id="' + CSS.escape(issue.id) + '"]');
          if (issue.styleCandidates && issue.styleCandidates.length) {
            const styleId = sel ? sel.value : issue.styleCandidates[0].id;
            selections.push({
              issueId: issue.id,
              nodeId: issue.nodeId,
              paintIndex: issue.paintIndex,
              styleId: styleId || null,
            });
            continue;
          }
          if (issue.tokenCandidates && issue.tokenCandidates.length) {
            const variableId = sel ? sel.value : issue.tokenCandidates[0].id;
            selections.push({
              issueId: issue.id,
              nodeId: issue.nodeId,
              paintIndex: issue.paintIndex,
              variableId: variableId || null,
            });
          }
        }
        return selections;
      }

      function renderDesignChips() {
        renderChipRow(designChipsEl, DESIGN_FILTERS, designFilter, (id) =>
          chipCountIn(designIssues(), id)
        );
      }

      function renderLayoutChips() {
        renderChipRow(layoutChipsEl, LAYOUT_FILTERS, layoutFilter, (id) =>
          chipCountIn(layoutTokenIssues(), id) + filteredLayoutAutoIssues(id).length
        );
      }

      function renderErrorChips() {
        const pool = designIssues().concat(layoutTokenIssues());
        const compsN = componentMatches.length;
        renderChipRow(errorChipsEl, ERROR_FILTERS, errorFilter, (id) => {
          if (id === "components") return compsN;
          const n = chipCountIn(pool, id) + filteredLayoutAutoIssues(id).length;
          return id === "all" ? n + compsN : n;
        });
      }

      function suggestionHtml(issue) {
        if (issue.styleCandidates && issue.styleCandidates.length) {
          const opts = issue.styleCandidates
            .map(
              (c, idx) =>
                '<option value="' +
                escapeHtml(c.id) +
                '"' +
                (idx === 0 ? " selected" : "") +
                ">" +
                escapeHtml(c.name) +
                "</option>"
            )
            .join("");
          return (
            '<div class="well">' +
            '<select data-issue-id="' +
            escapeHtml(issue.id) +
            '">' +
            opts +
            "</select>" +
            '<button class="btn btn-primary btn-sm" type="button" data-fix="' +
            escapeHtml(issue.id) +
            '">Fix</button>' +
            "</div>"
          );
        }
        if (issue.tokenCandidates && issue.tokenCandidates.length > 1) {
          const opts = issue.tokenCandidates
            .map(
              (c, idx) =>
                '<option value="' +
                escapeHtml(c.id) +
                '"' +
                (idx === 0 ? " selected" : "") +
                ">" +
                escapeHtml(c.name) +
                "</option>"
            )
            .join("");
          return (
            '<div class="well">' +
            '<select data-issue-id="' +
            escapeHtml(issue.id) +
            '">' +
            opts +
            "</select>" +
            '<span class="ambiguous">Multiple</span>' +
            '<button class="btn btn-primary btn-sm" type="button" data-fix="' +
            escapeHtml(issue.id) +
            '">Fix</button>' +
            "</div>"
          );
        }
        if (issue.tokenName && (issue.fixable || issue.matchQuality === "nearest")) {
          return (
            '<div class="well">' +
            '<span class="well-token">' +
            escapeHtml(issue.tokenName) +
            (issue.matchQuality === "nearest"
              ? '<span class="nearest">nearest</span>'
              : "") +
            "</span>" +
            '<button class="btn btn-primary btn-sm" type="button" data-fix="' +
            escapeHtml(issue.id) +
            '">Fix</button>' +
            "</div>"
          );
        }
        if (issue.kind === "detached-instance") {
          return '<div class="well"><span class="well-empty">Use Components tab to replace</span></div>';
        }
        return '<div class="well"><span class="well-empty">No match</span></div>';
      }

      function issueCardHtml(issue, menuPrefix) {
        const prefix = menuPrefix || "menu";
        const sub = escapeHtml(issue.nodeName) + " · " + escapeHtml(issue.valueLabel);
        const showFix =
          issue.category !== "layout" || issue.kind === "detached-instance";
        const iconKey =
          issue.kind === "detached-instance" ? "detached" : issue.category;
        const iconGlyph = CAT_ICON[iconKey] || "•";
        return (
          '<div class="card" data-id="' +
          escapeHtml(issue.id) +
          '">' +
          '<div class="card-head">' +
          '<div class="cat-icon">' +
          iconGlyph +
          "</div>" +
          '<div class="card-meta">' +
          '<p class="card-title">' +
          escapeHtml(issue.title) +
          "</p>" +
          '<div class="card-sub">' +
          sub +
          "</div>" +
          "</div>" +
          '<div class="kebab-wrap">' +
          '<button class="kebab" type="button" data-menu="' +
          escapeHtml(prefix + "-" + issue.id) +
          '" aria-label="More">⋯</button>' +
          '<div class="menu" id="' +
          escapeHtml(prefix + "-" + issue.id) +
          '">' +
          '<button type="button" data-select="' +
          escapeHtml(issue.nodeId) +
          '">Select layer</button>' +
          '<button type="button" data-ignore="' +
          escapeHtml(issue.nodeId) +
          '" data-ignore-name="' +
          escapeHtml(issue.nodeName) +
          '">Ignore layer</button>' +
          "</div>" +
          "</div>" +
          "</div>" +
          (showFix ? suggestionHtml(issue) : "") +
          "</div>"
        );
      }

      function matchCardHtml(match, selectPrefix) {
        const best = match.candidates && match.candidates[0];
        const sub = best
          ? "Best " + Math.round(best.score * 100) + "% · " + escapeHtml(best.name)
          : "No match in this file";
        const selKey = (selectPrefix || "match") + ":" + match.nodeId;
        return (
          '<div class="card" data-match-id="' +
          escapeHtml(match.nodeId) +
          '">' +
          '<div class="card-head">' +
          '<div class="cat-icon">◇</div>' +
          '<div class="card-meta">' +
          '<p class="card-title">' +
          escapeHtml(match.nodeName) +
          "</p>" +
          '<div class="card-sub">' +
          sub +
          "</div>" +
          "</div>" +
          "</div>" +
          matchSuggestionHtml(match, selKey) +
          "</div>"
        );
      }

      function sectionHtml(id, label, bodyHtml, count) {
        if (!bodyHtml) return "";
        return (
          '<div class="section" data-section="' +
          escapeHtml(id) +
          '">' +
          '<div class="section-label">' +
          escapeHtml(label) +
          '<span class="section-count">' +
          count +
          "</span>" +
          "</div>" +
          bodyHtml +
          "</div>"
        );
      }

      function groupedIssueHtml(list, cats, menuPrefix) {
        return cats
          .map((cat) => {
            const items = list.filter((i) => i.category === cat);
            if (!items.length) return "";
            const label =
              cat === "spacing"
                ? "Spacing"
                : cat === "radius"
                  ? "Radius"
                  : cat.charAt(0).toUpperCase() + cat.slice(1);
            return sectionHtml(
              cat,
              label,
              items.map((i) => issueCardHtml(i, menuPrefix)).join(""),
              items.length
            );
          })
          .join("");
      }

      function layoutGroupsHtml(tokens, autos, menuPrefix) {
        const prefix = menuPrefix || "err";
        const spacing = tokens.filter((i) => matchesChipFilter(i, "spacing"));
        const gap = tokens.filter((i) => matchesChipFilter(i, "gap"));
        const radius = tokens.filter((i) => matchesChipFilter(i, "radius"));
        const sizing = autos.filter((i) => i.kind === "layout-fixed-size");
        const detached = autos.filter((i) => i.kind === "detached-instance");
        const otherLayout = autos.filter(
          (i) => i.kind !== "layout-fixed-size" && i.kind !== "detached-instance"
        );
        return (
          sectionHtml(
            "spacing",
            "Spacing",
            spacing.map((i) => issueCardHtml(i, prefix)).join(""),
            spacing.length
          ) +
          sectionHtml(
            "gap",
            "Gap",
            gap.map((i) => issueCardHtml(i, prefix)).join(""),
            gap.length
          ) +
          sectionHtml(
            "radius",
            "Radius",
            radius.map((i) => issueCardHtml(i, prefix)).join(""),
            radius.length
          ) +
          sectionHtml(
            "sizing",
            "Sizing",
            sizing.concat(otherLayout).map((i) => issueCardHtml(i, prefix)).join(""),
            sizing.length + otherLayout.length
          ) +
          sectionHtml(
            "detached",
            "Detached",
            detached.map((i) => issueCardHtml(i, prefix)).join(""),
            detached.length
          )
        );
      }

      function skeletonCardHtml() {
        return (
          '<div class="skel-card" aria-hidden="true">' +
          '<div class="skel-head">' +
          '<div class="skel-icon"></div>' +
          '<div class="skel-meta">' +
          '<div class="skel-line med"></div>' +
          '<div class="skel-line short"></div>' +
          "</div></div></div>"
        );
      }

      function skeletonListHtml(count) {
        let html = "";
        for (let i = 0; i < count; i++) html += skeletonCardHtml();
        return html;
      }

      function scanningStatusHtml() {
        return (
          '<span class="status-scanning">' +
          '<span class="spinner" aria-hidden="true"></span>' +
          "Scanning the frame</span>"
        );
      }

      function showScanning() {
        scanning = true;
        openMenuId = null;
        statusEl.innerHTML = scanningStatusHtml();
        designStatusEl.innerHTML = scanningStatusHtml();
        layoutStatusEl.innerHTML = scanningStatusHtml();
        listEl.innerHTML = skeletonListHtml(4);
        designListEl.innerHTML = skeletonListHtml(4);
        layoutListEl.innerHTML = skeletonListHtml(4);
        fixableCountEl.textContent = "0";
        totalCountEl.textContent = "0";
        designCountEl.textContent = "0";
        layoutCountEl.textContent = "0";
        fixAllBtn.disabled = true;
        designFixAllBtn.disabled = true;
        layoutFixAllBtn.disabled = true;
      }

      function renderErrorList() {
        if (scanning) return;
        renderErrorChips();
        const showAll = errorFilter === "all";
        const compsOnly = errorFilter === "components";
        const design = compsOnly
          ? []
          : designIssues().filter((i) => matchesChipFilter(i, errorFilter));
        const layoutTok = compsOnly
          ? []
          : layoutTokenIssues().filter((i) => matchesChipFilter(i, errorFilter));
        const layoutAuto = compsOnly ? [] : filteredLayoutAutoIssues(errorFilter);
        const comps = showAll || compsOnly ? componentMatches : [];
        const fixablePool = design.concat(layoutTok).filter((i) => i.fixable);
        const total =
          design.length + layoutTok.length + layoutAuto.length + comps.length;

        fixableCountEl.textContent = String(fixablePool.length);
        totalCountEl.textContent = String(total);
        fixAllBtn.disabled = fixablePool.length === 0;

        if (!total) {
          listEl.innerHTML = '<div class="empty">No errors</div>';
          return;
        }

        const designCats =
          DESIGN_CATS.indexOf(errorFilter) !== -1 ? [errorFilter] : DESIGN_CATS;

        listEl.innerHTML =
          groupedIssueHtml(design, designCats, "err") +
          layoutGroupsHtml(layoutTok, layoutAuto, "err") +
          sectionHtml(
            "components",
            "Components",
            comps.map((m) => matchCardHtml(m, "err")).join(""),
            comps.length
          );
      }

      function renderDesignList() {
        if (scanning) return;
        renderDesignChips();
        const list = filteredDesignIssues();
        const fixable = list.filter((i) => i.fixable);
        designCountEl.textContent = String(list.length);
        designFixAllBtn.disabled = fixable.length === 0;
        designStatusEl.textContent = list.length
          ? list.length + " design issue" + (list.length === 1 ? "" : "s")
          : "Select a frame";

        if (!list.length) {
          designListEl.innerHTML = '<div class="empty">No design issues</div>';
          return;
        }

        designListEl.innerHTML = groupedIssueHtml(
          list,
          designFilter === "all" ? DESIGN_CATS : [designFilter],
          "design"
        );
      }

      function renderIgnored() {
        if (!ignoredLayers.length) {
          ignoredPanel.classList.add("hidden");
          ignoredListEl.innerHTML = "";
          return;
        }
        ignoredPanel.classList.remove("hidden");
        ignoredListEl.innerHTML = ignoredLayers
          .map(
            (layer) =>
              '<div class="ignored-row">' +
              '<span class="ignored-name" title="' +
              escapeHtml(layer.name) +
              '">' +
              escapeHtml(layer.name) +
              "</span>" +
              '<button type="button" class="ignored-remove" data-unignore="' +
              escapeHtml(layer.id) +
              '">Restore</button>' +
              "</div>"
          )
          .join("");
      }

      function setTab(tab) {
        activeTab = tab;
        tabsEl.querySelectorAll(".tab").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-tab") === tab);
        });
        panelSettings.classList.remove("active");
        panelErrors.classList.toggle("active", tab === "errors");
        panelDesign.classList.toggle("active", tab === "design");
        panelLayout.classList.toggle("active", tab === "layout");
        panelComponents.classList.toggle("active", tab === "components");
      }

      function renderLayoutPanel() {
        if (scanning) return;
        renderLayoutChips();
        const tokens = filteredLayoutTokenIssues();
        const autos = filteredLayoutAutoIssues();
        const fixable = tokens.filter((i) => i.fixable);
        const total = tokens.length + autos.length;
        layoutCountEl.textContent = String(total);
        layoutFixAllBtn.disabled = fixable.length === 0;
        layoutStatusEl.textContent = total
          ? total + " layout issue" + (total === 1 ? "" : "s")
          : "Select a frame";

        if (!total) {
          layoutListEl.innerHTML = '<div class="empty">No layout issues</div>';
          return;
        }

        layoutListEl.innerHTML = tokens
          .concat(autos)
          .map((i) => issueCardHtml(i, "lay"))
          .join("");
      }

      function candidateInitials(name) {
        const parts = String(name || "")
          .split(/[\/\s]+/)
          .filter(Boolean);
        if (!parts.length) return "?";
        return parts
          .slice(0, 2)
          .map((p) => p.charAt(0).toUpperCase())
          .join("");
      }

      function matchSuggestionHtml(match, selectKey) {
        if (!match.candidates || !match.candidates.length) {
          return '<div class="well"><span class="well-empty">No similar component</span></div>';
        }
        const key = selectKey || "match:" + match.nodeId;
        const tiles = match.candidates
          .map((c, idx) => {
            const selected = idx === 0;
            const pct = Math.round(c.score * 100) + "%";
            const thumb = c.preview
              ? '<img src="' +
                escapeHtml(c.preview) +
                '" alt="" />'
              : '<span class="cand-thumb-fallback">' +
                escapeHtml(candidateInitials(c.name)) +
                "</span>";
            return (
              '<div class="cand' +
              (selected ? " selected" : "") +
              '" role="button" tabindex="0" data-component-id="' +
              escapeHtml(c.componentId) +
              '" aria-pressed="' +
              (selected ? "true" : "false") +
              '" title="Use ' +
              escapeHtml(c.name) +
              " (" +
              pct +
              ')">' +
              '<div class="cand-thumb">' +
              thumb +
              "</div>" +
              '<div class="cand-foot">' +
              '<div class="cand-cap">' +
              escapeHtml(c.name) +
              " · " +
              pct +
              "</div>" +
              '<button class="cand-focus" type="button" data-focus="' +
              escapeHtml(c.componentId) +
              '" title="Focus component" aria-label="Focus ' +
              escapeHtml(c.name) +
              '">→</button>' +
              "</div>" +
              "</div>"
            );
          })
          .join("");
        return (
          '<div class="well select-well">' +
          '<div class="cand-grid" data-match-key="' +
          escapeHtml(key) +
          '">' +
          tiles +
          "</div>" +
          "</div>"
        );
      }

      function selectedComponentId(card, match) {
        const picked = card
          ? card.querySelector(".cand.selected")
          : null;
        if (picked) return picked.getAttribute("data-component-id") || "";
        return match && match.candidates && match.candidates[0]
          ? match.candidates[0].componentId
          : "";
      }

      function collectUseItems(rootEl) {
        const items = [];
        for (const match of componentMatches) {
          if (!match.candidates || !match.candidates.length) continue;
          const card = rootEl.querySelector(
            '[data-match-id="' + CSS.escape(match.nodeId) + '"]'
          );
          const componentId = selectedComponentId(card, match);
          if (!componentId) continue;
          items.push({ nodeId: match.nodeId, componentId: componentId });
        }
        return items;
      }

      function renderComponentMatches() {
        const usable = componentMatches.filter((m) => m.candidates && m.candidates.length);
        matchCountEl.textContent = String(usable.length);
        useAllBtn.disabled = usable.length === 0;

        if (!componentMatches.length) {
          componentListEl.innerHTML =
            '<div class="empty">No matching frames in selection</div>';
          componentStatusEl.textContent = "Select a frame to scan subframes";
          return;
        }

        componentStatusEl.textContent =
          usable.length +
          " matching frame" +
          (usable.length === 1 ? "" : "s");

        componentListEl.innerHTML = componentMatches
          .map((m) => matchCardHtml(m, "comp"))
          .join("");
      }

      function renderTabCounts() {
        const designN = designIssues().length;
        const layoutN = layoutTokenIssues().length + layoutIssues.length;
        const compsN = componentMatches.length;
        const errorsN = designN + layoutN + compsN;
        const byTab = {
          errors: errorsN,
          design: designN,
          layout: layoutN,
          components: compsN,
        };
        tabsEl.querySelectorAll(".tab").forEach((el) => {
          const tab = el.getAttribute("data-tab");
          const label = el.getAttribute("data-label") || el.textContent;
          const n = byTab[tab] || 0;
          el.textContent = n > 0 ? label + " (" + n + ")" : label;
        });
      }

      function refreshAllLists() {
        renderCoverage();
        renderValueChips();
        renderErrorList();
        renderDesignList();
        renderLayoutPanel();
        renderComponentMatches();
        renderIgnored();
        renderTabCounts();
      }

      const tabsLeftEl = tabsEl.querySelector(".tabs-left");
      let tabDrag = null;

      tabsLeftEl.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        const btn = e.target.closest("[data-tab]");
        tabDrag = {
          pointerId: e.pointerId,
          startX: e.clientX,
          scrollLeft: tabsLeftEl.scrollLeft,
          moved: false,
          tab: btn ? btn.getAttribute("data-tab") : null,
        };
      });

      tabsLeftEl.addEventListener("pointermove", (e) => {
        if (!tabDrag || e.pointerId !== tabDrag.pointerId) return;
        const dx = e.clientX - tabDrag.startX;
        if (!tabDrag.moved && Math.abs(dx) < 4) return;
        if (!tabDrag.moved) {
          tabDrag.moved = true;
          tabsLeftEl.classList.add("dragging");
          tabsLeftEl.setPointerCapture(e.pointerId);
        }
        tabsLeftEl.scrollLeft = tabDrag.scrollLeft - dx;
      });

      function endTabDrag(e) {
        if (!tabDrag || e.pointerId !== tabDrag.pointerId) return;
        const { moved, tab } = tabDrag;
        tabDrag = null;
        tabsLeftEl.classList.remove("dragging");
        if (!moved && tab) setTab(tab);
      }

      tabsLeftEl.addEventListener("pointerup", endTabDrag);
      tabsLeftEl.addEventListener("pointercancel", endTabDrag);

      errorChipsEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        errorFilter = btn.getAttribute("data-filter");
        openMenuId = null;
        renderErrorList();
      });

      designChipsEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        designFilter = btn.getAttribute("data-filter");
        openMenuId = null;
        renderDesignList();
      });

      layoutChipsEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        layoutFilter = btn.getAttribute("data-filter");
        openMenuId = null;
        renderLayoutPanel();
      });

      function handleIssueListClick(e) {
        const menuBtn = e.target.closest("[data-menu]");
        if (menuBtn) {
          const id = menuBtn.getAttribute("data-menu");
          openMenuId = openMenuId === id ? null : id;
          document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
          if (openMenuId) {
            const menu = document.getElementById(openMenuId);
            if (menu) menu.classList.add("open");
          }
          e.stopPropagation();
          return;
        }

        const selectBtn = e.target.closest("[data-select]");
        if (selectBtn) {
          parent.postMessage(
            {
              pluginMessage: {
                type: "focus-node",
                nodeId: selectBtn.getAttribute("data-select"),
              },
            },
            "*"
          );
          openMenuId = null;
          document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
          return;
        }

        const ignoreBtn = e.target.closest("[data-ignore]");
        if (ignoreBtn) {
          parent.postMessage(
            {
              pluginMessage: {
                type: "ignore-node",
                nodeId: ignoreBtn.getAttribute("data-ignore"),
                nodeName: ignoreBtn.getAttribute("data-ignore-name") || "Untitled",
              },
            },
            "*"
          );
          openMenuId = null;
          document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
          return;
        }

        const focusCand = e.target.closest(".cand-focus");
        if (focusCand) {
          e.stopPropagation();
          const componentId = focusCand.getAttribute("data-focus");
          if (componentId) {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "focus-node",
                  nodeId: componentId,
                },
              },
              "*"
            );
          }
          return;
        }

        const candBtn = e.target.closest(".cand");
        if (candBtn) {
          const grid = candBtn.closest(".cand-grid");
          if (grid) {
            grid.querySelectorAll(".cand").forEach((el) => {
              el.classList.remove("selected");
              el.setAttribute("aria-pressed", "false");
            });
            candBtn.classList.add("selected");
            candBtn.setAttribute("aria-pressed", "true");
          }
          const card = candBtn.closest("[data-match-id]");
          const nodeId = card ? card.getAttribute("data-match-id") : "";
          const componentId = candBtn.getAttribute("data-component-id");
          if (nodeId && componentId) {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "use-component",
                  nodeId: nodeId,
                  componentId: componentId,
                },
              },
              "*"
            );
          }
          return;
        }

        const fixBtn = e.target.closest("[data-fix]");
        if (fixBtn) {
          const id = fixBtn.getAttribute("data-fix");
          const issue = findIssue(id);
          if (!canFixIssue(issue)) return;
          parent.postMessage(
            {
              pluginMessage: {
                type: "fix-one",
                issueId: id,
                selections: collectSelections([issue]),
              },
            },
            "*"
          );
        }
      }

      valueChipsEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-spacing-value]");
        if (!btn) return;
        const raw = btn.getAttribute("data-spacing-value");
        focusSpacingValue = raw === "" || raw == null ? null : Number(raw);
        renderValueChips();
        parent.postMessage(
          {
            pluginMessage: {
              type: "focus-spacing-value",
              focusValue: focusSpacingValue,
            },
          },
          "*"
        );
      });

      listEl.addEventListener("click", handleIssueListClick);
      designListEl.addEventListener("click", handleIssueListClick);
      layoutListEl.addEventListener("click", handleIssueListClick);
      componentListEl.addEventListener("click", handleIssueListClick);

      ignoredListEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-unignore]");
        if (!btn) return;
        parent.postMessage(
          {
            pluginMessage: {
              type: "unignore-node",
              nodeId: btn.getAttribute("data-unignore"),
            },
          },
          "*"
        );
      });

      fixAllBtn.addEventListener("click", () => {
        const list = designIssues()
          .concat(layoutTokenIssues())
          .filter((i) => matchesChipFilter(i, errorFilter) && i.fixable);
        parent.postMessage(
          {
            pluginMessage: {
              type: "fix-all",
              issueIds: list.map((i) => i.id),
              selections: collectSelections(list),
            },
          },
          "*"
        );
      });

      designFixAllBtn.addEventListener("click", () => {
        const list = filteredDesignIssues().filter((i) => i.fixable);
        parent.postMessage(
          {
            pluginMessage: {
              type: "fix-all",
              issueIds: list.map((i) => i.id),
              selections: collectSelections(list),
            },
          },
          "*"
        );
      });

      layoutFixAllBtn.addEventListener("click", () => {
        const list = filteredLayoutTokenIssues().filter((i) => i.fixable);
        parent.postMessage(
          {
            pluginMessage: {
              type: "fix-all",
              issueIds: list.map((i) => i.id),
              selections: collectSelections(list),
            },
          },
          "*"
        );
      });

      useAllBtn.addEventListener("click", () => {
        const items = collectUseItems(componentListEl);
        if (!items.length) return;
        parent.postMessage(
          {
            pluginMessage: {
              type: "use-components",
              items: items,
            },
          },
          "*"
        );
      });

      settingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openSettings();
      });

      settingsBack.addEventListener("click", () => {
        closeSettings();
      });

      [
        optRadius,
        optPadding,
        optGap,
        optDistance,
        optLayout,
        optComponents,
        optColorRadius,
        optColorPadding,
        optColorGap,
      ].forEach((el) => {
        el.addEventListener("change", postOptions);
      });

      [optLabelScale, optOverlayOpacity, optPillOpacity].forEach((el) => {
        el.addEventListener("input", () => {
          syncRangeLabels();
          postOptions();
        });
      });

      document.addEventListener("click", () => {
        openMenuId = null;
        document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
      });

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "init") {
          optRadius.checked = !!msg.radius;
          optPadding.checked = !!msg.padding;
          optGap.checked = !!msg.gap;
          optDistance.checked = msg.distance !== false;
          optLayout.checked = msg.layout !== false;
          optComponents.checked = msg.components !== false;
          if (msg.colors) {
            if (msg.colors.radius) optColorRadius.value = String(msg.colors.radius).toLowerCase();
            if (msg.colors.padding) optColorPadding.value = String(msg.colors.padding).toLowerCase();
            if (msg.colors.gap) optColorGap.value = String(msg.colors.gap).toLowerCase();
          }
          if (msg.pillSize != null) {
            optLabelScale.value = String(msg.pillSize);
          } else if (msg.labelFontSize != null) {
            optLabelScale.value = String(Math.min(2, Math.max(0.5, Number(msg.labelFontSize) / 8)));
          }
          if (msg.overlayOpacity != null) {
            optOverlayOpacity.value = String(Math.round(Number(msg.overlayOpacity) * 100));
          }
          if (msg.pillOpacity != null) {
            optPillOpacity.value = String(Math.round(Number(msg.pillOpacity) * 100));
          }
          syncRangeLabels();
          ignoredLayers = msg.ignoredLayers || [];
          renderIgnored();
          return;
        }

        if (msg.type === "status") {
          if (!scanning) statusEl.textContent = msg.message || "";
          return;
        }

        if (msg.type === "lint-scanning") {
          showScanning();
          return;
        }

        if (msg.type === "lint-results") {
          if (scanning) statusEl.textContent = "";
          scanning = false;
          issues = msg.issues || [];
          ignoredLayers = msg.ignoredLayers || ignoredLayers;
          coveragePct = typeof msg.coveragePercent === "number" ? msg.coveragePercent : 100;
          openMenuId = null;
          refreshAllLists();
        }

        if (msg.type === "layout-results") {
          scanning = false;
          layoutIssues = msg.issues || [];
          openMenuId = null;
          refreshAllLists();
        }

        if (msg.type === "component-matches") {
          componentMatches = msg.matches || [];
          refreshAllLists();
        }

        if (msg.type === "spacing-values") {
          spacingValues = msg.values || [];
          focusSpacingValue =
            typeof msg.focusValue === "number" ? msg.focusValue : null;
          renderValueChips();
        }
      };

      refreshAllLists();
      parent.postMessage({ pluginMessage: { type: "ready" } }, "*");
    </script>
  </body>
</html>
